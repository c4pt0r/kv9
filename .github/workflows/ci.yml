name: CI

# The repo ran with no CI at all through Phase 1. Every gate -- 198 tests, clippy, and
# several multi-process E2E scripts -- was run by hand. This is the minimal automation
# that makes those checks survive nobody remembering to run them.
#
# Deliberate split, and the reason matters more than the shape:
#
#   pr-gate      fast. Runs on PRs and master. INTENDED required check --
#                a workflow cannot block a merge by itself; that takes a branch protection
#                rule or ruleset, which is a separate change and does not exist yet
#                (verified: branches/master/protection => 404, rulesets => []).
#   fmt          BLOCKING. The tree is formatted; drift is now a failure, not a report.
#   acceptance   multi-process E2E. master pushes only, real pass/fail. Not on PRs.
#
# The E2E scripts do not gate pull requests. During Phase 1 two separate diagnostic
# rounds went red because of bugs in the harness rather than the product (a killed
# node's stale status file read as live; a `local` declaration referencing the variable
# it was declaring). A gate that reddens for reasons unrelated to the change trains
# everyone to skim past red -- and this project's entire review discipline rests on
# treating a red as something you must explain.
#
# But they are not marked informational either: a red nobody is shown is barely
# different from no check at all. Running them on master with a real failure status
# keeps the signal visible without handing an unproven harness the power to block
# someone's PR. Add the PR trigger once a stretch of real runs shows it stable --
# on evidence, not on the strength of this comment.

# LANDING ORDER -- this commit must not reach master on its own.
#
# The acceptance matrix runs three scripts. At the time of writing, master (a75443a)
# contains only phase1-final-acceptance.sh; dynamic-membership-e2e.sh and raw-kv-e2e.sh
# arrive with the M1 combined tree (a86c12e), which this workflow is built on. Cherry-pick
# this file to master alone and two matrix legs die with exit 127 -- a correct red that has
# nothing to do with code quality, and one that reads as "CI itself is broken". That kind
# of red is more corrosive than a failing test, because it teaches people the gate is
# unreliable rather than that the code is.
#
# So: land with the combined tree, or after it. Never before, and never as an isolated
# cherry-pick. Merging this branch normally carries its parent chain and satisfies that on
# its own -- the hazard is someone lifting just this commit, which is an ordinary thing to
# want to do.

on:
  push:
    branches: [master]
  pull_request:

# Nothing here needs to write to the repository. Stated explicitly rather than inherited,
# so that a later job that does need a write has to ask for it visibly.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Display name held stable and unique as `pr-gate`: a required-status-check rule matches
  # on this string, so renaming it silently detaches any rule later configured against it.
  pr-gate:
    name: pr-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml names the CHANNEL (`stable`) and requests rustfmt + clippy. It does
      # NOT pin a version, and calling this job deterministic would be false: `stable` moves, so
      # this runner and a contributor's machine resolve different compilers. That is not
      # theoretical -- 1.94 locally vs 1.98 here produced three clippy failures that no local run
      # could reproduce.
      #
      # Standing decision (Tess, task #29): we accept the drift rather than pin a version, and
      # the HOSTED RUNNER IS CANONICAL -- a lint that fails here fails, whatever your local
      # toolchain says. The resolved versions are therefore printed on every run (below, and in
      # the rustfmt annotations) so "works on my machine" is always checkable against them.
      # Reproduce any CI-only failure with: rustup toolchain install <the version printed here>.
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
          cargo clippy --version

      - uses: Swatinem/rust-cache@v2

      # protoc is NOT preinstalled on ubuntu-latest, and crates/raft/build.rs plus
      # crates/server/build.rs invoke prost/tonic codegen, which shells out to it. The
      # first real run of this workflow failed here on every job -- pr-gate and all three
      # E2E legs -- with "Could not find `protoc`". It passed locally only because this
      # developer machine happens to have /usr/bin/protoc, which is exactly the class of
      # assumption a local run cannot test.
      #
      # apt rather than a setup-protoc action: one less third-party action in the trust
      # path, and the Debian package is sufficient for prost-build.
      #
      # cmake and build-essential ride along since the object-store dependency arrived.
      # Being precise about WHY, because the first version of this said "aws-lc-sys needs
      # cmake and a C compiler" and both halves were wrong (measured on x86_64 linux,
      # aws-lc-sys 0.45.0):
      #
      #   cmake  is NOT used. Two from-scratch builds with cmake absent from PATH both
      #          produced libaws_lc_0_45_0_crypto.a with zero CMakeCache.txt. The crate
      #          picks its builder at build time and took the `cc` path.
      #   cc     is required, but already was -- it is rustc's linker driver. Without it
      #          `libc` and `proc-macro2` fail long before aws-lc-sys, and did so before
      #          this dependency existed.
      #
      # So this line is not fixing a break; the delta on a working Rust host is zero. It is
      # installed anyway because the builder choice is made ON THE RUNNER, we do not control
      # the runner image, and "ubuntu-latest happens to have it" is the same assumption that
      # made protoc fail on this workflow's first real run. Making the choice independent of
      # the image costs one apt package.
      - name: Install protoc, cmake and a C toolchain
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake build-essential

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      # -D warnings: a warning nobody has to fix is a warning everybody stops reading.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Rustdoc intra-doc links are the one public-surface artifact no other gate
      # validates: clippy never reads them and doctests only run code blocks. Both
      # lints ride ONE cargo doc invocation here; that the two flags each bear load
      # independently was proven once at review time by single-lint red/green twins
      # (task #14 acceptance), so this step does not re-litigate it — a reviewer
      # checks both flags are literally present in the command below.
      #
      # A dedicated, explicitly removed target dir: rust-cache restores ./target,
      # and cargo doc suppresses repeated diagnostics on a warm tree — a cached
      # green would be a reading of some earlier run, not this one.
      #
      # The witness lines guard rule 21 (docs/TESTING.md): a green step must carry
      # positive work only THIS execution produced. `Documenting` lines come from
      # the real rustdoc runs; their count must equal the workspace member count
      # read from cargo metadata in the same run (self-adjusting when crates are
      # added — a pinned number would go stale silently). The terminal marker is
      # printed only after every check above it has passed under `set -e`; nothing
      # here is joined with `;` or a pipe, so no stage can hand this step someone
      # else's exit status.
      - name: Rustdoc link gate
        run: |
          set -euo pipefail
          rm -rf /tmp/doc-gate-target
          rc=0
          RUSTDOCFLAGS="-D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links" \
            cargo doc --workspace --no-deps --target-dir /tmp/doc-gate-target >/tmp/doc-gate.out 2>&1 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "rustdoc gate: cargo doc failed (rc=$rc) — the denied diagnostics follow"
            cat /tmp/doc-gate.out
            exit "$rc"
          fi
          members=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["packages"]))')
          documented=$(grep -c "Documenting" /tmp/doc-gate.out) || {
            echo "rustdoc gate: zero Documenting lines — cargo doc produced no work this run"
            cat /tmp/doc-gate.out
            exit 1
          }
          if [ "$documented" -ne "$members" ]; then
            echo "rustdoc gate: documented $documented crates but the workspace has $members — this run did not cover the tree"
            cat /tmp/doc-gate.out
            exit 1
          fi
          echo "rustdoc-gate: 2 lints denied; $documented/$members crates documented fresh"

      # The repository's two verification tools gate other people's evidence: the mutation
      # guard is what proves a test actually stands on a defect, and the unlanded check is
      # what proves a task-scoped marker did not outlive its task. Until now nothing proved
      # THEY still work -- an instrument nobody exercises is indistinguishable from a broken
      # one right up to the moment its answer matters.
      #
      # Two separate named steps, each invoking its script directly. Deliberately NOT a
      # wrapper, a shared shell block, or an `&&` chain: those make one failure indistinguishable
      # from the other, and a reviewer cannot then show that breaking EITHER call site alone
      # turns this gate red. Each script prints its own "N passed, M failed" line and exits
      # non-zero on any failure, so the count in the log is the evidence and the exit code is
      # the gate -- neither is inferred from the other.
      #
      # No `continue-on-error`, no `|| true`, no pipe: a pipeline would hand the step `tail`'s
      # exit status instead of the script's, which is the exact way a red becomes an
      # invisible green.
      # Each step consumes the self-test's EXACT TERMINAL MARKER from outside the script.
      # Exit status alone is not enough, and neither is an end-of-script assertion: a body
      # replaced by `exit 0` at line 1 returns rc=0 with empty output, never reaches any
      # assertion the script itself contains, and leaves a step still named "Self-test"
      # reporting success having run nothing. Cindy measured four bypasses -- missing script
      # (127), no executable bit (126), a real failure in the tool under test (1), and that
      # stubbed body, which was the only silently green one.
      #
      # The marker is the LAST line and carries no leading whitespace, so the comparison is
      # equality rather than a search: a `grep` anywhere in the output would also accept a
      # run that printed the line and then failed afterwards.
      #
      # Command substitution rather than a pipe: a pipeline hands this step the exit status
      # of the last stage instead of the script's.
      - name: Self-test — mutation guard
        run: |
          set +e
          output="$(scripts/mutation-guard-selftest.sh "$GITHUB_WORKSPACE/scripts/mutation-guard.sh")"
          rc=$?
          set -e
          printf '%s\n' "$output"
          [ "$rc" -eq 0 ] || exit "$rc"
          last="${output##*$'\n'}"
          [ "$last" = "39 passed, 0 failed" ] || {
            printf 'expected exact terminal selftest count, got: %s\n' "$last" >&2
            exit 1
          }

      - name: Self-test — unlanded marker check
        run: |
          set +e
          output="$(scripts/unlanded-check-selftest.sh "$GITHUB_WORKSPACE/scripts/unlanded-check.sh")"
          rc=$?
          set -e
          printf '%s\n' "$output"
          [ "$rc" -eq 0 ] || exit "$rc"
          last="${output##*$'\n'}"
          [ "$last" = "14 passed, 0 failed" ] || {
            printf 'expected exact terminal selftest count, got: %s\n' "$last" >&2
            exit 1
          }

      # Task #9 tripwires: four independent named steps. The two selftests
      # consume exact terminal markers so an rc=0 early exit cannot masquerade
      # as a successful instrument run.
      - name: Apply-store tripwire selftest
        run: |
          set +e
          output="$(scripts/apply-store-tripwire-selftest.sh "$GITHUB_WORKSPACE/scripts/apply-store-tripwire.sh")"
          rc=$?
          set -e
          printf '%s\n' "$output"
          [ "$rc" -eq 0 ] || exit "$rc"
          last="${output##*$'\n'}"
          [ "$last" = "7 passed, 0 failed" ] || {
            printf 'expected exact terminal selftest count, got: %s\n' "$last" >&2
            exit 1
          }

      - name: Apply-store tripwire
        run: scripts/apply-store-tripwire.sh

      - name: Manifest-key tripwire selftest
        run: |
          set +e
          output="$(scripts/manifest-key-tripwire-selftest.sh "$GITHUB_WORKSPACE/scripts/manifest-key-tripwire.sh")"
          rc=$?
          set -e
          printf '%s\n' "$output"
          [ "$rc" -eq 0 ] || exit "$rc"
          last="${output##*$'\n'}"
          [ "$last" = "8 passed, 0 failed" ] || {
            printf 'expected exact terminal selftest count, got: %s\n' "$last" >&2
            exit 1
          }

      - name: Manifest-key tripwire
        run: scripts/manifest-key-tripwire.sh

  # The MinIO backend's behaviour is a property of the SERVER, not of our code, so it cannot
  # be checked without one. `crates/engine/tests/minio_backend.rs` is `#[ignore]`d for exactly
  # that reason: without an endpoint those tests report as ignored rather than passing
  # vacuously. This job is what stops "ignored" from meaning "never run anywhere".
  #
  # Without it the cmake/toolchain steps above would only prove the backend COMPILES. The
  # load-bearing claim -- that the endpoint honours `If-None-Match: *`, so a second object
  # under one file-id is refused rather than silently overwriting bytes a committed manifest
  # points at -- is only ever established by a real request.
  minio-backend:
    name: minio-backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      # This job compiles the engine itself, so it installs the toolchain rather than
      # inheriting the runner image. See the pr-gate step for why cmake is here at all.
      - name: Install protoc, cmake and a C toolchain
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake build-essential

      # Generated per run, never stored. There is no credential in this repository, in a
      # secret, or in a fixture -- so there is nothing to leak, rotate, or accidentally
      # commit. `add-mask` covers the case where some later step prints one anyway.
      - name: Mint throwaway credentials
        run: |
          access="ci$(openssl rand -hex 8)"
          secret="$(openssl rand -hex 24)"
          echo "::add-mask::$access"
          echo "::add-mask::$secret"
          {
            echo "KV9_OBJECT_STORE_ENDPOINT=http://127.0.0.1:19000"
            echo "KV9_OBJECT_STORE_BUCKET=kv9-ci"
            echo "KV9_OBJECT_STORE_ACCESS_KEY=$access"
            echo "KV9_OBJECT_STORE_SECRET_KEY=$secret"
          } >> "$GITHUB_ENV"

      # Pinned by immutable DIGEST, not by a tag -- including not by `latest`, which is a
      # moving pointer and would let the server under test change without any commit here.
      # This exact digest is the image the suite was developed and first passed against
      # (label release RELEASE.2025-09-07T16-13-09Z), so CI exercises the same object the
      # evidence came from rather than whatever the tag resolves to on the day.
      #
      # 19000 rather than 9000: below the Linux ephemeral range (32768-60999), consistent
      # with the E2E port policy in the acceptance job.
      #
      # `docker run` rather than a `services:` block: the official image needs the `server
      # /data` argument, and a service container cannot pass one. Running it here also puts
      # the readiness check under our control instead of a health-check option.
      - name: Start MinIO
        run: |
          docker run -d --name kv9-minio-ci \
            -p 127.0.0.1:19000:9000 \
            -e MINIO_ROOT_USER="$KV9_OBJECT_STORE_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$KV9_OBJECT_STORE_SECRET_KEY" \
            quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data

      # BOUNDED, and a failure here is an environment failure reported as one. The wait is a
      # different quantity from the backend's own operation deadline on purpose: sharing one
      # number lets a slow start present as an unresponsive backend, which is how a timeout
      # test goes green for the wrong reason.
      #
      # Readiness is OBSERVED (a 200 from the health endpoint), not assumed from `docker run`
      # having returned. Once this step has succeeded, "MinIO had not come up yet" is no
      # longer available as an explanation for anything the suite reports.
      - name: Wait for MinIO to answer, then create the bucket
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 \
              http://127.0.0.1:19000/minio/health/live || true)
            if [ "$code" = "200" ]; then
              echo "MinIO answered 200 after ${i} probe(s)"
              ready=1
              break
            fi
            sleep 1
          done
          if [ "${ready:-0}" != "1" ]; then
            echo "::error title=MinIO never became ready::No 200 from /minio/health/live within 60s. This is an environment failure, not a test result -- the suite below was never given a server to talk to."
            docker logs kv9-minio-ci 2>&1 | tail -50
            exit 1
          fi
          docker exec \
            -e MC_HOST_ci="http://$KV9_OBJECT_STORE_ACCESS_KEY:$KV9_OBJECT_STORE_SECRET_KEY@127.0.0.1:9000" \
            kv9-minio-ci mc mb --ignore-existing "ci/$KV9_OBJECT_STORE_BUCKET"

      # The exit code is kept, and the counts are checked SEPARATELY. `cargo test --ignored`
      # exits 0 when it selects nothing at all, so an rc-only gate would read a suite that ran
      # zero tests exactly like one that ran and passed -- the same zero-selected-is-not-green
      # problem the mutation-guard self-test steps solve by consuming an exact terminal count.
      #
      # Three independent facts are asserted, because they fail differently:
      #   selected  the harness picked up 11 tests (a renamed file or a lost #[ignore] shows
      #             here, not as a silent shortfall)
      #   passed    all 11 passed with 0 failed
      #   ignored   ZERO were ignored -- an #[ignore] that stayed ignored under --ignored
      #             would otherwise be invisible
      #
      # The count is pinned. Adding a test to that file turns this red until the number here
      # is updated, which is the point: the pin is what makes a lost test visible.
      - name: Run the MinIO backend suite against the real server
        run: |
          set +e
          output="$(cargo test -p kv9-engine --test minio_backend -- --ignored --test-threads=1 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          [ "$rc" -eq 0 ] || { printf 'cargo test exited %s\n' "$rc" >&2; exit "$rc"; }

          printf '%s\n' "$output" | grep -qx 'running 18 tests' || {
            printf 'expected exactly 18 selected tests; the harness reported: %s\n' \
              "$(printf '%s\n' "$output" | grep -E '^running ')" >&2
            exit 1
          }
          printf '%s\n' "$output" \
            | grep -q '^test result: ok\. 18 passed; 0 failed; 0 ignored;' || {
            printf 'expected 18 passed / 0 failed / 0 ignored, got: %s\n' \
              "$(printf '%s\n' "$output" | grep '^test result:')" >&2
            exit 1
          }

      - name: Run backend configuration guard
        run: |
          set -o pipefail
          cargo test -p kv9-engine --test minio_backend 2>&1 | tee /tmp/minio-config.out
          grep -q '^test result: ok\. 1 passed; 0 failed; 18 ignored;' /tmp/minio-config.out

      - name: Run remote checkpoint recovery and corruption controls
        run: |
          set -o pipefail
          cargo test -p kv9-engine --test minio_checkpoint -- --ignored --test-threads=1 2>&1 | tee /tmp/minio-checkpoint.out
          grep -qx 'running 3 tests' /tmp/minio-checkpoint.out
          grep -q '^test result: ok\. 3 passed; 0 failed; 0 ignored;' /tmp/minio-checkpoint.out

      - name: Run distributed MinIO recovery acceptance
        run: |
          set -o pipefail
          scripts/minio-kv-e2e.sh 2>&1 | tee /tmp/minio-kv-e2e.out
          grep -Fxq 'PASS: minio-kv-e2e (3 replicas, failover, remote checkpoint, reclaimed WAL, live tail, deletes)' /tmp/minio-kv-e2e.out
        env:
          KV9_MINIO_EXTERNAL: "1"

      - name: Run pending-flush crash recovery cuts
        run: |
          set -o pipefail
          scripts/minio-pending-e2e.sh 2>&1 | tee /tmp/minio-pending-e2e.out
          grep -Fxq 'PASS: minio-pending-e2e (durable prepare, applied-before-clear, historical settlement, resumed flush)' /tmp/minio-pending-e2e.out
        env:
          KV9_MINIO_EXTERNAL: "1"

      - name: MinIO logs
        if: failure()
        run: docker logs kv9-minio-ci 2>&1 | tail -200

      - name: Stop MinIO
        if: always()
        run: docker rm -f kv9-minio-ci || true

  # Informational on purpose. `cargo fmt --check` does NOT pass on this tree: when this
  # workflow landed there were 159 diff hunks across 39 files, spanning all four crate
  # lanes. Making that blocking would paint CI red on day one for changes that did not
  # cause it -- the exact failure mode described in the header.
  #
  # Make this blocking after the tree is formatted in one deliberate pass (a cross-lane
  # change that needs its own announcement). Until then it reports drift without
  # punishing whoever opens the next PR.
  # A real gate now. The tree was formatted in the preceding commit, so a drift failure
  # names the change that introduced it rather than punishing whoever opened the next PR
  # -- which was the whole reason this stayed informational until now.
  #
  # Kept from the informational version: the resolved toolchain is still recorded on every
  # run. `rust-toolchain.toml` names the channel `stable`, not a version, so this runner and
  # a contributor's machine can format differently -- and now that the job blocks, a
  # disagreement about WHICH rustfmt is the one that matters has to be answerable. The
  # hosted runner is canonical; the version it used is printed below and in the failure.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Record the resolved toolchain
        run: |
          {
            echo "### rustfmt"
            echo
            echo '```'
            rustc --version
            cargo --version
            cargo clippy --version
            cargo fmt --version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Format check
        id: fmt
        run: cargo fmt --all --check

      # Runs only when the gate failed. `cargo fmt --all` locally is the entire fix, but the
      # annotation says which toolchain judged it, because `stable` moves and a contributor
      # whose local rustfmt is older can format to a different result and be confused by a
      # red they cannot reproduce.
      - name: Explain the failure
        if: failure() && steps.fmt.outcome == 'failure'
        run: |
          hunks=$(cargo fmt --all --check 2>/dev/null | grep -c '^Diff in' || true)
          files=$(cargo fmt --all --check 2>/dev/null | grep '^Diff in' | sed 's/:[0-9]*:$//' | sort -u | wc -l)
          echo "::error title=rustfmt::${hunks} hunk(s) across ${files} file(s) are unformatted. Fix with: cargo fmt --all. Judged by $(cargo fmt --version) on $(rustc --version); rust-toolchain.toml pins the channel 'stable', not a version, so an older local rustfmt may disagree -- the runner is canonical."

  # Runs on master pushes only, and NOT on pull requests -- deliberately, and this is a
  # different choice from the one this job started with.
  #
  # It was `continue-on-error: true` on every PR. Cindy asked the question that broke that:
  # who actually sees a red informational job? If the answer is "someone has to click into
  # the Actions tab", the job is close to not existing, and the whole reason for putting
  # E2E in CI was to stop depending on someone remembering. That would only move the
  # dependency from "remembering to run it" to "remembering to look at it".
  #
  # So: no continue-on-error, and no PR trigger. A failure here is a real red on master --
  # visible on the commit and in the branch's status -- while no one's PR is blocked by a
  # harness that has not yet earned that authority. If it proves stable, add the PR trigger
  # then, on evidence rather than on hope.
  #
  # One runner per script, so a port or leftover-process problem in one cannot be
  # misread as a failure of another. KV9_BASE_PORT is set explicitly rather than left
  # to the scripts' `$$ % 1000` default: a deterministic port makes a red reproducible,
  # and reproducing a red is how you find out where it actually went red.
  #
  # All bases sit below 32768 to stay clear of the Linux ephemeral range
  # (32768-60999), where an unrelated process can take a port between the bind check
  # and the bind itself.
  acceptance:
    name: E2E ${{ matrix.script }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - script: phase1-final-acceptance.sh
            base_port: 22100
            success_marker: "PASS: quorum fencing,"
          - script: dynamic-membership-e2e.sh
            base_port: 23100
            success_marker: "PASS: 3 voters -> admit/register learners"
          - script: raw-kv-e2e.sh
            base_port: 24100
            success_marker: "PASS: raw KV replicated through failover"
          # The documented quickstart, run as written. The prose version was wrong twice in one
          # day (`--help` listed none of the five raw commands; the walkthrough used a bare `kv9`
          # a clean clone does not have, and read the leader from n1 when n1 may be a follower).
          # Documentation drifts silently; this fails instead.
          - script: quickstart-smoke.sh
            base_port: 25100
            success_marker: "PASS: quickstart path works end to end"
          - script: root-trust-e2e.sh
            base_port: 26100
            success_marker: "PASS: explicit root, durable incarnation, fenced discovery, credentialed learner, and promotion"
          # Typed-exclusivity partition gate (task #28 layer b / #27 item 4): an
          # isolated leader must refuse raw reads with the NAMED typed families
          # (read_unconfirmed / not_leader) — transport errors explicitly do not
          # count, and the matcher carries its own dead-port negative control.
          # The script rebuilds the binary itself with --features
          # partition-testing (the mask surface is compiled out of every other
          # leg's production build).
          - script: partition-read-e2e.sh
            base_port: 27100
            success_marker: "PASS: isolated leader refuses reads typed"
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      # protoc is NOT preinstalled on ubuntu-latest, and crates/raft/build.rs plus
      # crates/server/build.rs invoke prost/tonic codegen, which shells out to it. The
      # first real run of this workflow failed here on every job -- pr-gate and all three
      # E2E legs -- with "Could not find `protoc`". It passed locally only because this
      # developer machine happens to have /usr/bin/protoc, which is exactly the class of
      # assumption a local run cannot test.
      #
      # apt rather than a setup-protoc action: one less third-party action in the trust
      # path, and the Debian package is sufficient for prost-build.
      #
      # cmake + build-essential: see the long note on the pr-gate install step. Same
      # reasoning, stated once there rather than duplicated -- but installed here too,
      # because this job compiles the workspace itself and must not inherit whatever the
      # runner image happens to carry.
      - name: Install protoc, cmake and a C toolchain
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake build-essential

      - name: Build binary
        run: cargo build --workspace

      # Two steps, not one. Checking only the exit code would trust a property CI cannot
      # see: these scripts happen to `set -euo pipefail` and print PASS on the last line,
      # but that is discipline inside the script, and a later `|| true` or an added pipe
      # would silently void it. Exit codes have already deceived us twice on this project
      # -- a harness that died under `| tail` still exited 0, and an early version of this
      # E2E exited 0 after running a single round.
      #
      # `tee` rather than `>` so the log still streams to the run output. Note `tee` would
      # otherwise donate its own exit status to the step; `set -o pipefail` keeps the
      # script's. The assertion is a separate step so "the script failed" and "the script
      # succeeded without reaching PASS" cannot be confused for each other.
      - name: Run ${{ matrix.script }}
        env:
          KV9_BASE_PORT: ${{ matrix.base_port }}
        run: |
          set -o pipefail
          ./scripts/${{ matrix.script }} 2>&1 | tee /tmp/e2e-${{ matrix.script }}.out

      # A unique marker per script, not a generic `^PASS`. A bare `^PASS` would accept any
      # PASS line, so a script that prints an intermediate PASS and then dies before its own
      # final line would still be read as green -- the assertion has to name the completion
      # it is asserting. -F because the markers contain `-` and `>`.
      - name: Assert ${{ matrix.script }} reached its own completion marker
        run: grep -Fq -- "${{ matrix.success_marker }}" /tmp/e2e-${{ matrix.script }}.out

      # Collect INTO the workspace first. The previous version pointed upload-artifact at the
      # absolute glob /tmp/kv9-* and set `if-no-files-found: ignore`; the one real failure we
      # have (run 33237982263 attempt 1, the phase1 formation timeout) uploaded ZERO artifacts
      # while the step reported success. The scene from the single failure we most needed to
      # explain was lost, and the loss was silent -- `ignore` turns "matched nothing" into a
      # green step, which is the same absence-read-as-success this repo keeps removing.
      #
      # `|| true` on the copy so a genuinely empty /tmp does not mask the script's own failure,
      # but the upload below is NOT allowed to be silent about finding nothing.
      - name: Collect the scene
        if: failure()
        run: |
          mkdir -p ci-scene
          cp -r /tmp/kv9-* ci-scene/ 2>/dev/null || true
          # The script's own diagnostic narrative goes to STDERR, which the run step tees into
          # /tmp/e2e-<script>.out -- a different prefix from the data directories. Collecting
          # only /tmp/kv9-* would ship an artifact holding status files but not the DIAG lines
          # that say whether the condition converged after the timeout, which is the whole
          # question. Checked against tess/phase1-blocker (1e6fa53), whose evidence is emitted
          # as `DIAG:` on stderr rather than written into artifact_dir.
          cp /tmp/e2e-*.out ci-scene/ 2>/dev/null || true
          # A status file is the whole point: record what was captured, so "we uploaded
          # nothing" can never again look identical to "we uploaded the evidence".
          {
            echo "collected at: $(date -u +%FT%TZ)"
            echo "matching dirs:"; ls -d /tmp/kv9-* 2>/dev/null || echo "  (none)"
            echo "status files:"; find ci-scene -name status -printf '  %p (%s bytes, mtime %TY-%Tm-%Td %TH:%TM:%TS)\n' 2>/dev/null || true
            # `fatal=` is printed for every status file even when empty, and the file is named
            # even when the line is absent. Cindy's point: "fatal was empty" and "we never
            # captured fatal" look identical afterwards, and they mean opposite things -- an
            # empty fatal RULES OUT the poisoned-and-exited case, while a missing capture rules
            # out nothing. A non-empty one carries the root cause outright
            # (`fatal at committed entry (term T, index I): <cause>`).
            echo "run transcripts (DIAG lines live here, not in the data dirs):"
            ls -l ci-scene/*.out 2>/dev/null | sed 's/^/  /' || echo "  (none captured)"
            echo "fatal lines (empty is itself evidence):"
            for f in $(find ci-scene -name status 2>/dev/null); do
              line=$(grep '^fatal=' "$f" 2>/dev/null || true)
              if [ -z "$line" ]; then echo "  $f: NO fatal= LINE PRESENT"; else echo "  $f: $line"; fi
            done
          } > ci-scene/COLLECTION-REPORT.txt
          echo "--- collection report ---"; cat ci-scene/COLLECTION-REPORT.txt
          # Give the guard teeth. `if-no-files-found: error` on the upload cannot fire, because
          # COLLECTION-REPORT.txt above always makes ci-scene/ non-empty -- so the upload always
          # finds a file and always succeeds. Cindy caught that: the report improved the
          # DIAGNOSIS (it distinguishes "collected nothing" from "uploaded nothing") but it
          # silently disarmed the GATE, turning a hard check back into a weak signal you have to
          # read. The same shape as the fmt job's swallowed red.
          #
          # This step already runs only under `if: failure()`, so exiting 1 here cannot turn a
          # passing run red; it makes an already-failing job say why its evidence is missing.
          # Two separate conditions, because they fail differently and mean different things.
          # Cindy's edge: `mktemp -d` creates the data directory before any node starts, so if
          # the nodes never came up the directory EXISTS and is EMPTY. A guard that only checks
          # for the directory passes, and we are back to a report nobody is forced to read.
          # The decision table needs status files, not directories, so that is what is checked.
          missing=""
          ls -d /tmp/kv9-* >/dev/null 2>&1 || missing="no /tmp/kv9-* directory at all"
          if [ -z "$missing" ] && ! find ci-scene -name status -type f | grep -q .; then
            missing="directories present but they contain no status file (nodes may never have started)"
          fi
          if [ -n "$missing" ]; then
            echo "::error title=scene collection has no readable evidence::A test failed and $missing. The DIAG transcript may still be in the log, but the per-node status files this run's diagnosis depends on are absent. Fix collection before trusting any attribution of this failure."
            exit 1
          fi

      # if-no-files-found: error, deliberately. If the scene is missing, the failure report is
      # incomplete and we want to know at once rather than discover it days later while trying
      # to diagnose something.
      - name: Upload the scene
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scene-${{ matrix.script }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-scene/
          if-no-files-found: error
          retention-days: 30
