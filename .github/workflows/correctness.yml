name: Correctness

# Proofs and actual Chaos Mesh acceptance run locally by default. Keep the hosted
# workflow available for release/key-milestone acceptance, without automatic charges.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  endpoint-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the pinned TLAPS and SANY toolchains
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --output tlapm.tar.gz \
            https://github.com/tlaplus/tlapm/releases/download/1.6.0-pre/tlapm-1.6.0-pre-x86_64-linux-gnu.tar.gz
          echo 'bfa5e5350ac1ec7202feecad0a4a71a5bb58c16a49660448b35b6f371ba9e2f5  tlapm.tar.gz' | sha256sum --check
          mkdir tlapm
          tar -xzf tlapm.tar.gz --strip-components=1 -C tlapm
          curl --fail --location --retry 3 --output tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo '936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  tla2tools.jar' | sha256sum --check
      - name: Check versioned endpoint CAS safety and conditional progress
        run: |
          set -euo pipefail
          python3 scripts/check-endpoint-protocol.py --tlapm "$RUNNER_TEMP/tlapm/bin/tlapm" \
            --jar "$RUNNER_TEMP/tla2tools.jar" --output "$RUNNER_TEMP/endpoint-protocol" \
            > "$RUNNER_TEMP/endpoint-protocol.log" 2>&1
          cat "$RUNNER_TEMP/endpoint-protocol.log"
          test "$(tail -1 "$RUNNER_TEMP/endpoint-protocol.log")" = 'PASS: 4 full endpoint model checks and 2 fair continuations; 8 protocol controls; 2 witnesses; 11 TLAPS theorems; 80 obligations; 2 audit controls; 8 output controls'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: endpoint-protocol
          path: |
            ${{ runner.temp }}/endpoint-protocol.log
            ${{ runner.temp }}/endpoint-protocol
          if-no-files-found: error

      # Reuse the pinned toolchain for the parameterized protocol extensions.
      # This workflow remains manual-only for release/key-milestone acceptance.
      - name: Check endpoint writer ordering and admission revocation
        run: |
          set -euo pipefail
          python3 scripts/check-endpoint-writers-protocol.py --tlapm "$RUNNER_TEMP/tlapm/bin/tlapm" \
            --jar "$RUNNER_TEMP/tla2tools.jar" --output "$RUNNER_TEMP/endpoint-writers-protocol" \
            > "$RUNNER_TEMP/endpoint-writers-protocol.log" 2>&1
          cat "$RUNNER_TEMP/endpoint-writers-protocol.log"
          test "$(tail -1 "$RUNNER_TEMP/endpoint-writers-protocol.log")" = 'PASS: 4 full endpoint-writer model checks and 2 fair continuations; 8 protocol controls; 2 witnesses; 14 TLAPS theorems; 111 obligations; 2 audit controls; 10 output controls'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: endpoint-writers-protocol
          path: |
            ${{ runner.temp }}/endpoint-writers-protocol.log
            ${{ runner.temp }}/endpoint-writers-protocol
          if-no-files-found: error

      - name: Check endpoint confirmation and durable recovery
        run: |
          set -euo pipefail
          python3 scripts/check-endpoint-recovery-protocol.py --tlapm "$RUNNER_TEMP/tlapm/bin/tlapm" \
            --jar "$RUNNER_TEMP/tla2tools.jar" --output "$RUNNER_TEMP/endpoint-recovery-protocol" \
            > "$RUNNER_TEMP/endpoint-recovery-protocol.log" 2>&1
          cat "$RUNNER_TEMP/endpoint-recovery-protocol.log"
          test "$(tail -1 "$RUNNER_TEMP/endpoint-recovery-protocol.log")" = 'PASS: 4 full endpoint-recovery model checks and 2 fair continuations; 10 protocol controls; 2 witnesses; 15 TLAPS theorems; 165 obligations; 2 audit controls; 10 output controls'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: endpoint-recovery-protocol
          path: |
            ${{ runner.temp }}/endpoint-recovery-protocol.log
            ${{ runner.temp }}/endpoint-recovery-protocol
          if-no-files-found: error

      - name: Check read admission safety and conditional progress
        run: |
          set -euo pipefail
          python3 scripts/check-read-admission-protocol.py --tlapm "$RUNNER_TEMP/tlapm/bin/tlapm" \
            --jar "$RUNNER_TEMP/tla2tools.jar" --output "$RUNNER_TEMP/read-admission-protocol" \
            > "$RUNNER_TEMP/read-admission-protocol.log" 2>&1
          cat "$RUNNER_TEMP/read-admission-protocol.log"
          test "$(tail -1 "$RUNNER_TEMP/read-admission-protocol.log")" = 'PASS: 4 full read-admission model checks and 2 fair continuations; 8 protocol controls; 2 witnesses; 15 TLAPS theorems; 196 obligations; 2 audit controls; 10 output controls'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: read-admission-protocol
          path: |
            ${{ runner.temp }}/read-admission-protocol.log
            ${{ runner.temp }}/read-admission-protocol
          if-no-files-found: error

  protocol-deduction:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the pinned TLAPS and SANY toolchains
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --output tlapm.tar.gz \
            https://github.com/tlaplus/tlapm/releases/download/1.6.0-pre/tlapm-1.6.0-pre-x86_64-linux-gnu.tar.gz
          echo 'bfa5e5350ac1ec7202feecad0a4a71a5bb58c16a49660448b35b6f371ba9e2f5  tlapm.tar.gz' | sha256sum --check
          mkdir tlapm
          tar -xzf tlapm.tar.gz --strip-components=1 -C tlapm
          curl --fail --location --retry 3 --output tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo '936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  tla2tools.jar' | sha256sum --check
      - name: Check Raft route ownership safety, delivery and termination
        run: |
          set -euo pipefail
          python3 scripts/check-route-protocol.py --tlapm "$RUNNER_TEMP/tlapm/bin/tlapm" \
            --jar "$RUNNER_TEMP/tla2tools.jar" --output "$RUNNER_TEMP/route-protocol" \
            > "$RUNNER_TEMP/route-protocol.log" 2>&1
          cat "$RUNNER_TEMP/route-protocol.log"
          test "$(tail -1 "$RUNNER_TEMP/route-protocol.log")" = 'PASS: 4 full route model checks and 2 fair continuations; 8 protocol controls; 2 witnesses; 17 TLAPS theorems; 197 obligations; 2 audit controls; 8 output controls'
      - name: Check durable store lifecycle safety and conditional progress
        run: |
          set -euo pipefail
          python3 scripts/check-store-protocol.py --tlapm "$RUNNER_TEMP/tlapm/bin/tlapm" \
            --jar "$RUNNER_TEMP/tla2tools.jar" --output "$RUNNER_TEMP/store-protocol" \
            > "$RUNNER_TEMP/store-protocol.log" 2>&1
          cat "$RUNNER_TEMP/store-protocol.log"
          test "$(tail -1 "$RUNNER_TEMP/store-protocol.log")" = 'PASS: 4 full store model checks and 1 fair continuation; 8 protocol controls; 2 witnesses; 14 TLAPS theorems; 138 obligations; 2 audit controls; 8 output controls'
      - name: Check original-store catalog formation safety and conditional progress
        run: |
          set -euo pipefail
          python3 scripts/check-formation-protocol.py --tlapm "$RUNNER_TEMP/tlapm/bin/tlapm" \
            --jar "$RUNNER_TEMP/tla2tools.jar" --output "$RUNNER_TEMP/formation-protocol" \
            > "$RUNNER_TEMP/formation-protocol.log" 2>&1
          cat "$RUNNER_TEMP/formation-protocol.log"
          test "$(tail -1 "$RUNNER_TEMP/formation-protocol.log")" = 'PASS: 4 full formation model checks and 1 fair continuation; 8 protocol controls; 2 witnesses; 14 TLAPS theorems; 153 obligations; 2 audit controls; 8 output controls'
      - name: Check replica receive authority safety and conditional progress
        run: |
          set -euo pipefail
          python3 scripts/check-receive-protocol.py --tlapm "$RUNNER_TEMP/tlapm/bin/tlapm" \
            --jar "$RUNNER_TEMP/tla2tools.jar" --output "$RUNNER_TEMP/receive-protocol" \
            > "$RUNNER_TEMP/receive-protocol.log" 2>&1
          cat "$RUNNER_TEMP/receive-protocol.log"
          test "$(tail -1 "$RUNNER_TEMP/receive-protocol.log")" = 'PASS: 4 full receive model checks and 1 fair continuation; 7 protocol controls; 2 witnesses; 13 TLAPS theorems; 117 obligations; 2 audit controls; 8 output controls'
      - name: Check persistent client protocol and audited deductive proofs
        run: |
          set -euo pipefail
          python3 scripts/check-client-protocol.py --tlapm "$RUNNER_TEMP/tlapm/bin/tlapm" \
            --jar "$RUNNER_TEMP/tla2tools.jar" --output "$RUNNER_TEMP/client-protocol" \
            > "$RUNNER_TEMP/client-protocol.log" 2>&1
          cat "$RUNNER_TEMP/client-protocol.log"
          test "$(tail -1 "$RUNNER_TEMP/client-protocol.log")" = 'PASS: 4 full client model checks; 3 protocol controls; 2 witnesses; 8 TLAPS theorems; 66 obligations; 2 audit controls; 6 output controls'
      - name: Check every deductive proof and reject isolated invalid controls
        run: |
          set -euo pipefail
          python3 scripts/check-tlaps.py --tlapm "$RUNNER_TEMP/tlapm/bin/tlapm" \
            --jar "$RUNNER_TEMP/tla2tools.jar" --output "$RUNNER_TEMP/protocol-deduction" \
            > "$RUNNER_TEMP/protocol-deduction.log" 2>&1
          cat "$RUNNER_TEMP/protocol-deduction.log"
          test "$(tail -1 "$RUNNER_TEMP/protocol-deduction.log")" = 'PASS: 47 TLAPS theorems; 534 proof obligations; 15 isolated controls; 3 output controls'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-deduction
          path: |
            ${{ runner.temp }}/route-protocol.log
            ${{ runner.temp }}/route-protocol
            ${{ runner.temp }}/formation-protocol.log
            ${{ runner.temp }}/formation-protocol
            ${{ runner.temp }}/store-protocol.log
            ${{ runner.temp }}/store-protocol
            ${{ runner.temp }}/receive-protocol.log
            ${{ runner.temp }}/receive-protocol
            ${{ runner.temp }}/client-protocol.log
            ${{ runner.temp }}/client-protocol
            ${{ runner.temp }}/protocol-deduction.log
            ${{ runner.temp }}/protocol-deduction
          if-no-files-found: error

  protocol-models:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the pinned TLC model checker
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" | sha256sum --check
      - name: Check protocol models, isolated faults and reachability
        run: |
          set -euo pipefail
          python3 scripts/check-tla.py --jar "$RUNNER_TEMP/tla2tools.jar" \
            --output "$RUNNER_TEMP/protocol-models" > "$RUNNER_TEMP/protocol-models.log" 2>&1
          cat "$RUNNER_TEMP/protocol-models.log"
          test "$(tail -1 "$RUNNER_TEMP/protocol-models.log")" = 'PASS: 4 full model checks; 6 isolated controls; 3 reachability witnesses; 4 output controls'
      - name: Check Ready persistence, crash cuts and fail-stop controls
        run: |
          set -euo pipefail
          python3 scripts/check-ready-tla.py --jar "$RUNNER_TEMP/tla2tools.jar" \
            --output "$RUNNER_TEMP/ready-models" > "$RUNNER_TEMP/ready-models.log" 2>&1
          cat "$RUNNER_TEMP/ready-models.log"
          test "$(tail -1 "$RUNNER_TEMP/ready-models.log")" = 'PASS: 4 full Ready model checks; 3 isolated controls; 2 reachability witnesses; 3 output controls'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-models
          path: |
            ${{ runner.temp }}/protocol-models.log
            ${{ runner.temp }}/protocol-models
            ${{ runner.temp }}/ready-models.log
            ${{ runner.temp }}/ready-models
          if-no-files-found: error

  protocol-proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Lean toolchain
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --output lean.tar.zst \
            https://github.com/leanprover/lean4/releases/download/v4.33.1/lean-4.33.1-linux.tar.zst
          echo '890afd185370f85666025b883914ab4f4b339136f8c96167b69cfb62aecaf235  lean.tar.zst' | sha256sum --check
          tar --zstd -xf lean.tar.zst
          echo "LEAN=$RUNNER_TEMP/lean-4.33.1-linux/bin/lean" >> "$GITHUB_ENV"
      - name: Check every theorem and reject invalid controls
        run: |
          set -euo pipefail
          python3 scripts/check-proofs.py --self-test > "$RUNNER_TEMP/proof-check.log" 2>&1
          cat "$RUNNER_TEMP/proof-check.log"
          test "$(tail -1 "$RUNNER_TEMP/proof-check.log")" = 'PASS: 24 theorems checked; 9 invalid controls rejected'
      - name: Check independent history controls
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/history -p 'test_*.py' -v > "$RUNNER_TEMP/history-controls.log" 2>&1
          cat "$RUNNER_TEMP/history-controls.log"
          grep -Eq '^Ran 38 tests in ' "$RUNNER_TEMP/history-controls.log"
          test "$(tail -1 "$RUNNER_TEMP/history-controls.log")" = OK
          python3 scripts/history/check-controls.py --output "$RUNNER_TEMP/history-mutations" > "$RUNNER_TEMP/history-mutations.log" 2>&1
          cat "$RUNNER_TEMP/history-mutations.log"
          test "$(tail -1 "$RUNNER_TEMP/history-mutations.log")" = 'PASS: 38 history tests and 14 isolated source mutations checked'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-proofs
          path: |
            ${{ runner.temp }}/proof-check.log
            ${{ runner.temp }}/history-controls.log
            ${{ runner.temp }}/history-mutations.log
            ${{ runner.temp }}/history-mutations
          if-no-files-found: error

  chaos-mesh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KV9_KIND_CLUSTER: kv9-chaos-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Select the run's isolated kubeconfig
        run: echo "KUBECONFIG=$RUNNER_TEMP/kv9-chaos.kubeconfig" >> "$GITHUB_ENV"
      - name: Install build dependencies
        run: sudo bash scripts/install-ci-deps.sh
      - name: Install pinned Kind and Helm
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          mkdir kv9-tools
          curl --fail --location --retry 3 --output kv9-tools/kind \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kv9-tools/kind' | sha256sum --check
          chmod +x kv9-tools/kind
          curl --fail --location --retry 3 --output helm.tar.gz \
            https://get.helm.sh/helm-v3.21.4-linux-amd64.tar.gz
          echo '61f88ab166748cb19604d7884cb100ae9ccb13804ddeb98e08af167eacbb6a14  helm.tar.gz' | sha256sum --check
          tar -xzf helm.tar.gz
          cp linux-amd64/helm kv9-tools/helm
          echo "$RUNNER_TEMP/kv9-tools" >> "$GITHUB_PATH"
      - name: Create an isolated cluster with real Chaos Mesh
        run: scripts/chaos-mesh-setup.sh
      - name: Build the default production binary
        run: cargo build --bin kv9
      - name: Verify bounded logging and failure preservation
        run: |
          set -euo pipefail
          python3 scripts/check-bounded-log.py --output "$RUNNER_TEMP/bounded-log-controls" > "$RUNNER_TEMP/bounded-log-controls.log" 2>&1
          cat "$RUNNER_TEMP/bounded-log-controls.log"
          test "$(tail -1 "$RUNNER_TEMP/bounded-log-controls.log")" = 'PASS: 6 bounded logging controls verified'
      - name: Run and verify the Chaos Mesh acceptance matrix
        run: |
          set -euo pipefail
          bash scripts/run-bounded-log.sh "$RUNNER_TEMP/chaos-mesh.log" 20m 15s scripts/chaos-mesh-e2e.sh
          test "$(grep -Fxc 'PASS: Chaos Mesh root boundary, Pod kill/failure, partition, delay, container recovery, and Raft I/O faults' "$RUNNER_TEMP/chaos-mesh.log")" = 1
          test "$(grep -Fxc 'PASS: concurrent Raw KV/catalog history is valid across the Chaos Mesh matrix' "$RUNNER_TEMP/chaos-mesh.log")" = 1
          test "$(grep -Fxc 'PASS: persistent full history verified across 21 Chaos windows; three invalid fault evidence controls rejected' "$RUNNER_TEMP/chaos-mesh.log")" = 1
          test "$(grep -Fxc 'PASS: actual retained-PVC endpoint migration and both complete histories; five invalid evidence controls rejected' "$RUNNER_TEMP/chaos-mesh.log")" = 1
          test "$(grep -Fxc 'PASS: all three voters refused independent replacement PVCs and recovered original stores; six invalid evidence controls rejected' "$RUNNER_TEMP/chaos-mesh.log")" = 1
          test "$(grep -Fxc 'PASS: all three voters refused repeated missing-log starts after PodChaos and recovered; five invalid evidence controls rejected' "$RUNNER_TEMP/chaos-mesh.log")" = 1
          test "$(grep -Fxc 'PASS: container-kill restarted the killed container in the same Pod and original store with a live endpoint' "$RUNNER_TEMP/chaos-mesh.log")" = 1
          test "$(grep -Fxc 'PASS: database read and write succeeded after persistent collector removal' "$RUNNER_TEMP/chaos-mesh.log")" = 1
          test "$(grep -c '^Stage: sustained Pod failure for voter [123] and majority service$' "$RUNNER_TEMP/chaos-mesh.log")" = 3
          test "$(grep -c '^PASS: IOChaos voter [123] errno \(5\|28\) reached Raft, exited, and recovered with majority service$' "$RUNNER_TEMP/chaos-mesh.log")" = 6
          test "$(grep -Fxc 'PASS: joiner reached Serving with an exact receipt while its first seed was blackholed' "$RUNNER_TEMP/chaos-mesh.log")" = 1
          test "$(grep -Fxc 'PASS: bounded public admission refused pressure while the partitioned quorum served history' "$RUNNER_TEMP/chaos-mesh.log")" = 1
          test "$(grep -Fxc 'PASS: 4 invalid admission pressure controls rejected' "$RUNNER_TEMP/chaos-mesh.log")" = 1
          test "$(grep -Fxc 'PASS: latency metrics cover real pressure, six I/O failures and recovery; three invalid evidence controls rejected' "$RUNNER_TEMP/chaos-mesh.log")" = 1
          for phase in registration-seed-blackhole pod-failure-1 pod-failure-2 pod-failure-3 partition public-admission-overload delay endpoint-migration-pending endpoint-migration-recovered; do
            test "$(grep -Fxc "PASS: concurrent put and read completed during $phase" "$RUNNER_TEMP/chaos-mesh.log")" = 1
            test "$(grep -Fxc "PASS: persistent put and read completed during $phase" "$RUNNER_TEMP/chaos-mesh.log")" = 1
          done
          test "$(grep -Fxc 'PASS: original-store formation recovered after all-voter Chaos Mesh faults with accepted KV history' "$RUNNER_TEMP/chaos-mesh.log")" = 1
          for voter in 1 2 3; do
            for errno in 5 28; do
              test "$(grep -Fxc "PASS: concurrent put and read completed during io-voter-$voter-errno-$errno" "$RUNNER_TEMP/chaos-mesh.log")" = 1
              test "$(grep -Fxc "PASS: persistent put and read completed during io-voter-$voter-errno-$errno" "$RUNNER_TEMP/chaos-mesh.log")" = 1
              test "$(grep -Fxc "PASS: IOChaos voter $voter errno $errno reached Raft, exited, and recovered with majority service" "$RUNNER_TEMP/chaos-mesh.log")" = 1
            done
          done
      - name: Collect cluster diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/chaos-cluster"
          timeout --kill-after=10s 120s kind export logs --name "$KV9_KIND_CLUSTER" "$RUNNER_TEMP/chaos-cluster" || true
          timeout --kill-after=5s 30s kubectl --request-timeout=10s get pods -A -o wide > "$RUNNER_TEMP/chaos-cluster/pods.txt" 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaos-mesh-evidence
          path: |
            ${{ runner.temp }}/chaos-mesh.log
            ${{ runner.temp }}/chaos-cluster
            ${{ runner.temp }}/bounded-log-controls
            ${{ runner.temp }}/bounded-log-controls.log
            /tmp/kv9-chaos-e2e.*
          if-no-files-found: error
      - name: Remove this run's cluster
        if: always()
        run: timeout --kill-after=10s 120s kind delete cluster --name "$KV9_KIND_CLUSTER"
