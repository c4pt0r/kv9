[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/meta",
    "crates/engine",
    "crates/raft",
    "crates/region",
    "crates/txn",
    "crates/server",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/kv9/kv9"
description = "kv9 — a single-binary, multi-tenant distributed key-value engine (design skeleton)."

# Pure-Rust runtime dependencies. gRPC `.proto` sources are compiled with the
# pinned protoc toolchain; raft-rs stays on `protobuf-codec` independently.
[workspace.dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
raft = { version = "=0.7.0", default-features = false, features = ["protobuf-codec"] }
slog = "2"
# rust-protobuf runtime - already in tree via raft-proto (protobuf-codec); named
# directly so the transport can serialize raft Messages. No new code pulled.
protobuf = "2"
# Persistent (structurally-shared) ordered map: O(1) snapshots for MemEngine.
# MIT-licensed, to keep the dependency set copyleft-free.
rpds = "1"
# Public and node-internal RPC. tonic 0.14 split its Prost codec/build adapter
# into dedicated crates; pin the family together so generated code and runtime
# cannot drift independently.
prost = "=0.14.4"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "=0.1.19", features = ["net"] }
tonic = { version = "=0.14.6", features = ["transport"] }
tonic-prost = "=0.14.6"
tonic-prost-build = "=0.14.6"

# Internal crates
kv9-common = { path = "crates/common" }
kv9-meta = { path = "crates/meta" }
kv9-engine = { path = "crates/engine" }
kv9-raft = { path = "crates/raft" }
kv9-region = { path = "crates/region" }
kv9-txn = { path = "crates/txn" }
kv9-server = { path = "crates/server" }

[package]
name = "kv9"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "kv9 single binary."

[[bin]]
name = "kv9"
path = "src/main.rs"

[dependencies]
kv9-common.workspace = true
kv9-meta.workspace = true
kv9-engine.workspace = true
kv9-raft.workspace = true
kv9-region.workspace = true
kv9-txn.workspace = true
kv9-server.workspace = true
