[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/meta",
    "crates/engine",
    "crates/raft",
    "crates/region",
    "crates/txn",
    "crates/server",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/kv9/kv9"
description = "kv9 — a single-binary, multi-tenant distributed key-value engine (design skeleton)."

# Runtime dependencies. gRPC `.proto` sources are compiled with the pinned protoc
# toolchain; raft-rs stays on `protobuf-codec` independently.
#
# These were pure Rust until `object_store` (see the note on it below, which records the
# measurement and the reason). The heading is corrected rather than left standing, because
# a reader checking whether this tree pulls native code should get the answer here, not
# forty lines down.
[workspace.dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
raft = { version = "=0.7.0", default-features = false, features = ["protobuf-codec"] }
slog = "2"
# rust-protobuf runtime - already in tree via raft-proto (protobuf-codec); named
# directly so the transport can serialize raft Messages. No new code pulled.
protobuf = "2"
# Persistent (structurally-shared) ordered map: O(1) snapshots for MemEngine.
# MIT-licensed, to keep the dependency set copyleft-free.
rpds = "1"
# Object storage client. ROADMAP "Dependency decisions" names this crate; `aws` only,
# defaults off, because MinIO speaks the S3 API and every other cloud backend stays out.
#
# THIS IS WHERE THE "pure-Rust runtime dependencies" LINE ABOVE STOPS BEING TRUE, and the
# exception is recorded rather than left for someone to discover:
#
#   size                    measured at the head that introduced it (see that
#                           commit message for the numbers). Counts are deliberately
#                           NOT repeated here: a figure in a comment goes stale on the
#                           next dependency change and nothing makes it red.
#   native code             aws-lc-sys and ring carry C and assembly. aws-lc-sys is
#                           actually compiled, so cmake and a C compiler are now BUILD
#                           REQUIREMENTS -- the first in this repo since protoc, and the
#                           same class of thing: it passes locally on a machine that
#                           happens to have them
#   licences                no copyleft and none unspecified. aws-lc-sys is a conjunction
#                           including BSD-3-Clause; the ICU crates are Unicode-3.0
#
# Why we took it anyway (Tess, task #12 thread): the alternative was hand-writing
# PUT/GET/LIST/DELETE plus SigV4, which moves protocol compatibility, signature
# correctness and their security maintenance into kv9. A native crypto dependency is a
# smaller risk than a self-maintained authentication implementation.
# Imported under an explicit alias. `crates/engine/src/object_store.rs` is OUR module and
# also exports a trait named `ObjectStore`; without the alias a bare `object_store::` path
# inside any engine submodule silently resolves to the EXTERNAL crate, not ours. Measured,
# not assumed: `use object_store::aws::AmazonS3Builder` compiles from inside a submodule,
# and `aws` exists only upstream.
s3_client = { package = "object_store", version = "0.14", default-features = false, features = ["aws"] }
# `s3_client::ObjectStore::list` returns a `BoxStream`, and the trait that drives it is not
# re-exported. Already in the tree as object_store's own dependency, so naming it directly
# adds no package -- it makes an existing edge visible instead of reaching through another
# crate's dependency graph. Used only inside the object-store worker.
futures_util = { package = "futures-util", version = "0.3", default-features = false }
# Public and node-internal RPC. tonic 0.14 split its Prost codec/build adapter
# into dedicated crates; pin the family together so generated code and runtime
# cannot drift independently.
prost = "=0.14.4"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "=0.1.19", features = ["net"] }
tonic = { version = "=0.14.6", features = ["transport"] }
tonic-prost = "=0.14.6"
tonic-prost-build = "=0.14.6"

# Internal crates
kv9-common = { path = "crates/common" }
kv9-meta = { path = "crates/meta" }
kv9-engine = { path = "crates/engine" }
kv9-raft = { path = "crates/raft" }
kv9-region = { path = "crates/region" }
kv9-txn = { path = "crates/txn" }
kv9-server = { path = "crates/server" }

[package]
name = "kv9"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "kv9 single binary."

[[bin]]
name = "kv9"
path = "src/main.rs"

[features]
# Compiles the deterministic partition-injection surface (kv9-raft's testing
# feature) into the kv9 binary for the partition E2E ONLY. Never enable in a
# production build: the mask can drop real raft traffic. A binary built with
# this but launched without KV9_TESTING_PARTITION_DIR never partitions.
partition-testing = ["kv9-raft/testing"]

[dependencies]
kv9-common.workspace = true
kv9-meta.workspace = true
kv9-engine.workspace = true
kv9-raft.workspace = true
kv9-region.workspace = true
kv9-txn.workspace = true
kv9-server.workspace = true
