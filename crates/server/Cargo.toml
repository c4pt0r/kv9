[package]
name = "kv9-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "kv9 node assembly + API traits (Raw/Admin/Router) + request routing (DESIGN §4, §11)."

[dependencies]
kv9-common.workspace = true
kv9-meta.workspace = true
kv9-engine.workspace = true
kv9-raft.workspace = true
kv9-region.workspace = true
kv9-raw.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
libc = "=0.2.189"
parking_lot = "=0.12.5"
prost.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tokio-util = { version = "0.7", features = ["codec", "rt"] }
futures_util = { workspace = true, features = ["std"] }

[build-dependencies]
tonic-prost-build.workspace = true

[dev-dependencies]
hyper-util = { version = "=0.1.20", features = ["tokio"] }
tower = { version = "=0.5.3", features = ["util"] }
raft.workspace = true
protobuf.workspace = true
# `testing` here and nowhere else: with resolver = "2" a dev-dependency feature is not
# unified into the normal build, so FaultyEngine stays out of the shipped binary.
kv9-engine = { workspace = true, features = ["testing"] }
kv9-raft = { workspace = true, features = ["testing", "experimental-leader-lease"] }

[features]
# Test-only crash gates, never enabled by default.
checkpoint-testing = []
# Programmatic experimental installation requires an explicitly supplied clock.
# No default clock or CLI enablement is selected by this feature.
experimental-leader-lease = ["kv9-raft/experimental-leader-lease"]
