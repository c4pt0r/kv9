[package]
name = "kv9-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "kv9 node assembly + API traits (Txn/Raw/Admin/Router) + request routing (DESIGN §4, §11)."

[dependencies]
kv9-common.workspace = true
kv9-meta.workspace = true
kv9-engine.workspace = true
kv9-raft.workspace = true
kv9-region.workspace = true
kv9-txn.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
prost.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tarpc = { version = "=0.38.0", optional = true, features = ["tokio1", "serde-transport-bincode", "tcp"] }
tokio-util = { version = "0.7", optional = true, features = ["codec"] }
futures_util = { workspace = true, optional = true }

[build-dependencies]
tonic-prost-build.workspace = true

[dev-dependencies]
raft.workspace = true
protobuf.workspace = true
# `testing` here and nowhere else: with resolver = "2" a dev-dependency feature is not
# unified into the normal build, so FaultyEngine stays out of the shipped binary.
kv9-engine = { workspace = true, features = ["testing"] }
kv9-raft = { workspace = true, features = ["testing"] }

[features]
# Test-only crash gates, never enabled by default.
checkpoint-testing = []
# Isolated transport comparison. Never enabled in the default runtime.
rpc-experiment = ["dep:tarpc", "dep:tokio-util", "dep:futures_util"]
