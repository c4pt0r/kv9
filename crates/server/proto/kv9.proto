syntax = "proto3";

package kv9.v1;

// The public client surface. Authentication is transport metadata interpreted
// by the server interceptor; callers may not self-assert an identity in a body.
service Kv9 {
  // Direct/raw KV.
  rpc RawGet(RawGetRequest) returns (RawGetResponse);
  rpc RawBatchGet(RawBatchGetRequest) returns (RawBatchGetResponse);
  rpc RawPut(RawPutRequest) returns (RawWriteResponse);
  rpc RawBatchPut(RawBatchPutRequest) returns (RawWriteResponse);
  rpc RawDelete(RawDeleteRequest) returns (RawWriteResponse);
  rpc RawScan(RawScanRequest) returns (ScanResponse);
  rpc RawDeleteRange(RawDeleteRangeRequest) returns (RawDeleteRangeResponse);

  // Snapshot-Isolation transactions.
  rpc KvBegin(KvBeginRequest) returns (KvBeginResponse);
  rpc KvGet(KvGetRequest) returns (KvGetResponse);
  rpc KvBatchGet(KvBatchGetRequest) returns (KvBatchGetResponse);
  rpc KvScan(KvScanRequest) returns (ScanResponse);
  rpc KvPrewrite(KvPrewriteRequest) returns (Empty);
  rpc KvCommit(KvCommitRequest) returns (Empty);
  rpc KvPessimisticLock(KvPessimisticLockRequest) returns (Empty);
  rpc KvPessimisticRollback(KvPessimisticRollbackRequest) returns (Empty);
  rpc KvResolveLock(KvResolveLockRequest) returns (Empty);
  rpc KvCleanup(KvCleanupRequest) returns (Empty);
  rpc KvCheckTxnStatus(KvCheckTxnStatusRequest) returns (KvCheckTxnStatusResponse);

  // Metadata / administration.
  rpc CreateKeyspace(CreateKeyspaceRequest) returns (CreateKeyspaceResponse);
  rpc ListKeyspaces(ListKeyspacesRequest) returns (ListKeyspacesResponse);
  rpc GetRegion(GetRegionRequest) returns (GetRegionResponse);
  rpc SplitRegion(SplitRegionRequest) returns (Empty);
  rpc ClusterInfo(ClusterInfoRequest) returns (ClusterInfoResponse);
  rpc AdmitNode(AdmitNodeRequest) returns (MembershipChangeResponse);
  rpc PromoteNode(PromoteNodeRequest) returns (MembershipChangeResponse);
  rpc GetNodeEndpoint(GetNodeEndpointRequest) returns (GetNodeEndpointResponse);
  rpc ChangeNodeEndpoint(ChangeNodeEndpointRequest) returns (ChangeNodeEndpointResponse);
}

message Empty {}

message NodeEndpoint {
  uint64 node_id = 1;
  bytes store_incarnation = 2;
  string address = 3;
  uint64 generation = 4;
  optional string previous_address = 5;
  bool active = 6;
}

message GetNodeEndpointRequest { uint64 node_id = 1; }
message GetNodeEndpointResponse {
  bytes cluster_id = 1;
  // Absent means the node is not in the directory at this linearizable read.
  NodeEndpoint endpoint = 2;
}

message ChangeNodeEndpointRequest {
  bytes cluster_id = 1;
  uint64 node_id = 2;
  bytes store_incarnation = 3;
  string expected_address = 4;
  uint64 expected_generation = 5;
  string new_address = 6;
}

message EndpointReceipt {
  NodeEndpoint endpoint = 1;
  uint64 applied_term = 2;
  uint64 applied_index = 3;
}

enum EndpointRefusal {
  ENDPOINT_REFUSAL_UNSPECIFIED = 0;
  ENDPOINT_REFUSAL_WRONG_CLUSTER = 1;
  ENDPOINT_REFUSAL_MISSING_NODE = 2;
  ENDPOINT_REFUSAL_INACTIVE_NODE = 3;
  ENDPOINT_REFUSAL_INVALID_INCARNATION = 4;
  ENDPOINT_REFUSAL_CONFLICT = 5;
  ENDPOINT_REFUSAL_GENERATION_EXHAUSTED = 6;
}

message ChangeNodeEndpointResponse {
  oneof outcome {
    // The position of this invocation's committed mutation.
    EndpointReceipt changed = 1;
    // A fresh exact confirmation barrier. This is never an original receipt.
    EndpointReceipt confirmed = 2;
    // This invocation did not stage an endpoint mutation.
    EndpointRefusal refused = 3;
  }
}

message AdmitNodeRequest {
  uint64 node_id = 1;
  string addr = 2;
  uint64 ttl_seconds = 3;
}

message PromoteNodeRequest { uint64 node_id = 1; }

message MembershipChangeResponse {
  uint64 applied_term = 1;
  uint64 applied_index = 2;
  repeated uint64 voters = 3;
  repeated uint64 learners = 4;
  // Present only on AdmitNode. This one-time secret is returned once; the
  // catalog commits only its SHA-256 digest and PromoteNode leaves it empty.
  string join_ticket = 5;
}

// The position a raw write actually reached in the replicated log.
//
// `applied`, not `proposed`: the server already waited for this exact entry to be
// applied before responding, so a client that reads these fields is observing a
// committed fact rather than an intention. Deriving the position from a status file
// instead cannot prove identity -- a concurrent command can move that number.
message RawWriteResponse {
  uint64 applied_term = 1;
  uint64 applied_index = 2;
}

// A range delete is several entries, so its outcome is a progress report.
//
// An empty or no-op range legitimately reports zero chunks and a 0/0 position.
message RawDeleteRangeResponse {
  uint64 committed_chunks = 1;
  uint64 last_applied_term = 2;
  uint64 last_applied_index = 3;
}

message RegionEpoch {
  uint64 conf_ver = 1;
  uint64 version = 2;
}

// Required on every data-plane request. The server rejects a missing epoch;
// zero is a valid value inside a present RegionEpoch message.
message RequestContext {
  uint32 keyspace_id = 1;
  RegionEpoch region_epoch = 2;
}

message OptionalValue {
  bool found = 1;
  bytes value = 2;
}

message KeyValue {
  bytes key = 1;
  bytes value = 2;
}

message ScanResponse {
  repeated KeyValue pairs = 1;
}

message RawGetRequest {
  RequestContext context = 1;
  bytes key = 2;
}

message RawGetResponse {
  OptionalValue value = 1;
}

message RawBatchGetRequest {
  RequestContext context = 1;
  repeated bytes keys = 2;
}

message RawBatchGetResponse {
  // Positionally aligned with the request keys.
  repeated OptionalValue values = 1;
}

message RawPutRequest {
  RequestContext context = 1;
  bytes key = 2;
  bytes value = 3;
}

message RawBatchPutRequest {
  RequestContext context = 1;
  repeated KeyValue pairs = 2;
}

message RawDeleteRequest {
  RequestContext context = 1;
  bytes key = 2;
}

message RawScanRequest {
  RequestContext context = 1;
  bytes start = 2;
  bytes end = 3;
  uint32 limit = 4;
}

message RawDeleteRangeRequest {
  RequestContext context = 1;
  bytes start = 2;
  bytes end = 3;
}

message TransactionId {
  uint64 txn_group_id = 1;
  uint64 timeline_id = 2;
  uint64 timeline_generation = 3;
  uint64 start_ts = 4;
}

message QualifiedKey {
  uint32 keyspace_id = 1;
  bytes user_key = 2;
}

message TransactionDescriptor {
  uint32 keyspace_id = 1;
  TransactionId id = 2;
  QualifiedKey primary = 3;
}

message KvBeginRequest {
  RequestContext context = 1;
  QualifiedKey primary = 2;
}

message KvBeginResponse {
  TransactionDescriptor transaction = 1;
}

message KvGetRequest {
  RequestContext context = 1;
  bytes key = 2;
  TransactionDescriptor transaction = 3;
}

message KvGetResponse {
  OptionalValue value = 1;
}

message KvBatchGetRequest {
  RequestContext context = 1;
  repeated bytes keys = 2;
  TransactionDescriptor transaction = 3;
}

message KvBatchGetResponse {
  // Positionally aligned with the request keys.
  repeated OptionalValue values = 1;
}

message KvScanRequest {
  RequestContext context = 1;
  bytes start = 2;
  bytes end = 3;
  uint32 limit = 4;
  TransactionDescriptor transaction = 5;
}

message Mutation {
  bytes key = 1;
  oneof operation {
    bytes put_value = 2;
    bool delete = 3;
  }
}

message KvPrewriteRequest {
  RequestContext context = 1;
  repeated Mutation mutations = 2;
  TransactionDescriptor transaction = 3;
}

message KvCommitRequest {
  RequestContext context = 1;
  repeated bytes keys = 2;
  TransactionDescriptor transaction = 3;
}

message KvPessimisticLockRequest {
  RequestContext context = 1;
  repeated bytes keys = 2;
  TransactionDescriptor transaction = 3;
}

message KvPessimisticRollbackRequest {
  RequestContext context = 1;
  repeated bytes keys = 2;
  TransactionDescriptor transaction = 3;
}

message KvResolveLockRequest {
  RequestContext context = 1;
  TransactionDescriptor transaction = 2;
}

message KvCleanupRequest {
  RequestContext context = 1;
  bytes key = 2;
  TransactionDescriptor transaction = 3;
}

message KvCheckTxnStatusRequest {
  RequestContext context = 1;
  TransactionDescriptor transaction = 2;
}

message KvCheckTxnStatusResponse {
  oneof decision {
    TxnLocked locked = 1;
    uint64 committed_ts = 2;
    TxnRolledBack rolled_back = 3;
  }
}

message TxnLocked {}

message TxnRolledBack {}

enum ApiType {
  API_TYPE_UNSPECIFIED = 0;
  API_TYPE_TXN = 1;
  API_TYPE_RAW = 2;
}

message CreateKeyspaceRequest {
  string name = 1;
  uint64 tenant_id = 2;
  ApiType api_type = 3;
}

message CreateKeyspaceResponse {
  uint32 keyspace_id = 1;
  // Present when the production Raft-backed runtime served the mutation.
  // Clients use the pair, never index alone, to correlate failover safely.
  optional uint64 proposed_term = 2;
  optional uint64 proposed_index = 3;
}

message ListKeyspacesRequest {}

message Keyspace {
  uint32 id = 1;
  string name = 2;
  uint64 tenant_id = 3;
  ApiType api_type = 4;
  // Absent for raw keyspaces.
  optional uint64 txn_group_id = 5;
}

message ListKeyspacesResponse {
  repeated Keyspace keyspaces = 1;
}

message GetRegionRequest {
  uint32 keyspace_id = 1;
  bytes key = 2;
}

message RegionLocation {
  uint64 region_id = 1;
  RegionEpoch epoch = 2;
  optional uint64 leader_node_id = 3;
}

message GetRegionResponse {
  RegionLocation region = 1;
}

message SplitRegionRequest {
  uint64 region_id = 1;
  bytes split_key = 2;
}

message ClusterInfoRequest {}

message ClusterInfoResponse {
  uint64 node_count = 1;
  uint64 keyspace_count = 2;
  uint64 region_count = 3;
}
