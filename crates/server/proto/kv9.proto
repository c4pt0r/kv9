syntax = "proto3";

package kv9.v1;

// The public client surface. Authentication is transport metadata interpreted
// by the server interceptor; callers may not self-assert an identity in a body.
service Kv9 {
  // Scoped methods are distinct: an older service cannot ignore routing identity.
  rpc LookupRawRoute(LookupRawRouteRequest) returns (LookupRawRouteResponse);
  rpc RoutedRaw(RoutedRawRequest) returns (RoutedRawResponse);
  // Distinct method: old peers must never silently discard TTL presence.
  rpc RawTtl(RawTtlRequest) returns (RawTtlResponse);
  // Explicit one-way format activation. Every success carries a NEW receipt.
  rpc ActivateRawTtl(ActivateRawTtlRequest) returns (RawTtlResponse);

  // Direct/raw KV.
  rpc RawGet(RawGetRequest) returns (RawGetResponse);
  rpc RawBatchGet(RawBatchGetRequest) returns (RawBatchGetResponse);
  rpc RawPut(RawPutRequest) returns (RawWriteResponse);
  rpc RawBatchPut(RawBatchPutRequest) returns (RawWriteResponse);
  // Atomic range batch: mixed puts/deletes applied as ONE Raft entry. Every key
  // must lie in one range; a batch that crosses a range is refused, never split.
  rpc RawBatch(RawBatchRequest) returns (RawWriteResponse);
  rpc RawDelete(RawDeleteRequest) returns (RawWriteResponse);
  rpc RawScan(RawScanRequest) returns (ScanResponse);
  rpc RawDeleteRange(RawDeleteRangeRequest) returns (RawDeleteRangeResponse);

  // Metadata / administration.
  rpc CreateDataGroup(CreateDataGroupRequest) returns (CreateDataGroupResponse);
  // Distinct method: old servers must refuse, never silently create a legacy keyspace.
  rpc CreateDataKeyspace(CreateDataKeyspaceRequest) returns (CreateDataKeyspaceResponse);
  rpc CreateKeyspace(CreateKeyspaceRequest) returns (CreateKeyspaceResponse);
  rpc ListKeyspaces(ListKeyspacesRequest) returns (ListKeyspacesResponse);
  rpc GetRegion(GetRegionRequest) returns (GetRegionResponse);
  rpc ClusterInfo(ClusterInfoRequest) returns (ClusterInfoResponse);
  rpc AdmitNode(AdmitNodeRequest) returns (MembershipChangeResponse);
  rpc RevokeAdmission(RevokeAdmissionRequest) returns (MembershipChangeResponse);
  rpc PromoteNode(PromoteNodeRequest) returns (MembershipChangeResponse);
  // Remove a metadata voter through the group's own log: leader-only, never
  // self, three voters must remain (docs/VOTER-REPLACEMENT.md).
  rpc RemoveNode(RemoveNodeRequest) returns (MembershipChangeResponse);
  rpc GetNodeEndpoint(GetNodeEndpointRequest) returns (GetNodeEndpointResponse);
  // Administrative read surface (docs/KV9-ADMIN.md §4). NodeStatus is served by
  // every node about itself from the same renderer as its status file; ListNodes is
  // a linearizable read of the catalog's node directory at the metadata leader.
  rpc NodeStatus(NodeStatusRequest) returns (NodeStatusResponse);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  // Committed data-group rows joined per group, and the TASKS history page by page
  // (docs/KV9-ADMIN.md §4, increment 2). Both are linearizable leader reads.
  rpc ListDataGroups(ListDataGroupsRequest) returns (ListDataGroupsResponse);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc ChangeNodeEndpoint(ChangeNodeEndpointRequest) returns (ChangeNodeEndpointResponse);
  // Tracking-only retention administration. No object deletion or installation.
  rpc ApplyRetention(ApplyRetentionRequest) returns (ApplyRetentionResponse);
  rpc GetRetentionOwner(GetRetentionOwnerRequest) returns (GetRetentionOwnerResponse);
  // Committed migration authority only: no transfer, peer, membership or
  // pin-release capability. Old servers must refuse these distinct methods.
  rpc MigrateDataGroup(MigrateDataGroupRequest) returns (MigrateDataGroupResponse);
  rpc BindMigrationImage(BindMigrationImageRequest) returns (BindMigrationImageResponse);
  rpc AttachMigrationLearner(AttachMigrationLearnerRequest) returns (AttachMigrationLearnerResponse);
  rpc PlanMigrationImage(PlanMigrationImageRequest) returns (PlanMigrationImageResponse);
  rpc CaptureMigrationImage(CaptureMigrationImageRequest) returns (CaptureMigrationImageResponse);
  rpc EmitInstallEvidence(EmitInstallEvidenceRequest) returns (EmitInstallEvidenceResponse);
  rpc RecordInstallEvidence(RecordInstallEvidenceRequest) returns (RecordInstallEvidenceResponse);
  rpc RecordMigrationAbort(RecordMigrationAbortRequest) returns (RecordMigrationAbortResponse);
  rpc DetachAbortedLearner(DetachAbortedLearnerRequest) returns (DetachAbortedLearnerResponse);
  rpc RecordSourceTruncation(RecordSourceTruncationRequest) returns (RecordSourceTruncationResponse);
  rpc RecordGroupCompaction(RecordGroupCompactionRequest) returns (RecordGroupCompactionResponse);
  rpc TruncateSourceLog(TruncateSourceLogRequest) returns (TruncateSourceLogResponse);
  rpc PromoteMigrationVoter(PromoteMigrationVoterRequest) returns (PromoteMigrationVoterResponse);
  rpc RecordSourceRemoval(RecordSourceRemovalRequest) returns (RecordSourceRemovalResponse);
  rpc RemoveSourceReplica(RemoveSourceReplicaRequest) returns (RemoveSourceReplicaResponse);
}

message Empty {}

// Exact range identity and protocol generation are mandatory. A capabilities
// request confirms this contract on the target; it does not activate a group.
message RawTtlRequest {
  bytes binding = 1;
  uint32 protocol_version = 2;
  uint64 budget_micros = 3; // 1..30_000_000, shared by all server stages.
  oneof operation {
    Empty capabilities = 4;
    RoutedKeys get = 5;
    RawTtlPut put = 6;
    bytes delete_key = 7;
    RawTtlScan scan = 8;
    RawTtlScan delete_range = 9; // V2: at most one bounded chunk, not a whole-range transaction.
  }
}
message ActivateRawTtlRequest {
  bytes binding = 1;
  uint32 protocol_version = 2;
  uint64 budget_micros = 3;
}
message RawTtlPut {
  repeated KeyValue pairs = 1;
  // Absent clears expiry, present zero expires at apply. Seconds, not ms.
  optional uint64 ttl_secs = 2;
}
message RawTtlScan { bytes start = 1; bytes end = 2; uint32 limit = 3; }
message RawTtlPage {
  repeated KeyValue pairs = 1;
  optional bytes next = 2; // Continue even if pairs is empty.
  uint32 examined = 3;
}
message RawTtlDeleted {
  uint32 processed_keys = 1;
  RawWriteResponse applied = 2; // Present iff processed_keys > 0.
  optional bytes next = 3; // Inclusive next position; no replay after an unknown result.
}
message RawTtlResponse {
  bytes binding_digest = 1;
  uint32 protocol_version = 2;
  oneof result {
    Empty capabilities = 3;
    RawBatchGetResponse values = 4;
    RawWriteResponse applied = 5;
    RawTtlPage page = 6;
    RawTtlDeleted deleted = 7;
  }
}

message CreateDataKeyspaceRequest {
  bytes root_digest = 1;
  uint64 creation_task = 2;
  string name = 3;
  uint64 tenant_id = 4;
}
message CreateDataKeyspaceResponse {
  bytes binding = 1; // Canonical KV9RNG01, not proof of data-group readiness.
  bool changed = 2;
  uint64 applied_term = 3;
  uint64 applied_index = 4;
  uint32 keyspace_id = 5;
  uint64 region_id = 6;
}

// Create an initially empty, fixed-voter group and request local activation.
// This does not assign a key range or authorize public KV access.
message CreateDataGroupRequest {
  bytes root_digest = 1; // Exact 32-byte certified metadata root.
  bytes operation_id = 2; // Nonzero 16-byte immutable retry identity.
  repeated uint64 voters = 3; // Exactly 3, 5 or 7 active registered stores.
}
message CreateDataGroupResponse {
  bytes creation_intent = 1; // Canonical KV9GRP01 observation.
  bool changed = 2;
  // When changed=false, this is a NEW confirmation, not an original receipt.
  // Applied desire is not quorum readiness or proof that any replica started.
  uint64 applied_term = 3;
  uint64 applied_index = 4;
  // The same identities decoded, for clients that do not parse KV9GRP01.
  uint64 creation_task = 5;
  uint64 region_id = 6;
}

// Commit one immutable replica-migration intent for an activated group. The
// destination's current exact store incarnation is bound at planning time.
message MigrateDataGroupRequest {
  bytes root_digest = 1; // Exact 32-byte certified metadata root.
  bytes operation_id = 2; // Nonzero 16-byte immutable retry identity.
  uint64 creation_task = 3; // Committed creation row of the source group.
  uint64 destination_node = 4; // Active registered store, not an initial replica.
}
message MigrateDataGroupResponse {
  bytes migration_intent = 1; // Canonical KV9MIG01 observation.
  bool changed = 2;
  // When changed=false, this is a NEW confirmation, not an original receipt.
  // A committed intent authorizes image-owner binding and nothing else.
  uint64 applied_term = 3;
  uint64 applied_index = 4;
}

// Bind source/destination retention owners to one described image. The
// manifest is data, not authority; every binding is re-checked against the
// committed intent and range. Owners are tracking-only pins.
message BindMigrationImageRequest {
  bytes root_digest = 1;
  bytes operation_id = 2; // The committed migration operation.
  bytes manifest = 3; // Canonical checkpoint manifest description.
}
// Commit the migration destination as a LEARNER of the source group and
// advance the engine cut past the configuration entry, so the next capture
// names the learner. No promotion, replication, installation or serving.
message AttachMigrationLearnerRequest {
  bytes root_digest = 1;
  bytes operation_id = 2;
}
message AttachMigrationLearnerResponse {
  uint64 destination_node = 1;
  // False confirms an existing learner; the receipt is a NEW commit.
  bool changed = 2;
  uint64 cut_term = 3;
  uint64 cut_index = 4;
}

// Durably select and independently register a fixed capture plan through
// metadata Raft, then return its manifest for owner binding. No object I/O.
message PlanMigrationImageRequest {
  bytes root_digest = 1;
  bytes operation_id = 2;
}
message PlanMigrationImageResponse {
  bytes manifest = 1; // Canonical checkpoint manifest; a description only.
  uint64 cut_term = 2;
  uint64 cut_index = 3;
}

// Capture one committed migration's source image at the group leader's
// registered immutable cut. Verifies Published pins before upload/readback; the record
// grants no serving, voting, install or release capability.
message CaptureMigrationImageRequest {
  bytes root_digest = 1;
  bytes operation_id = 2; // The committed migration operation.
}
message CaptureMigrationImageResponse {
  bytes record = 1; // Canonical KV9RSN01 snapshot record for the installer.
  bytes image_digest = 2;
  uint64 cut_term = 3;
  uint64 cut_index = 4;
  // 0 when the attached configuration is the group's initial one.
  uint64 configuration_applied_index = 5;
  uint64 objects = 6;
  uint64 object_bytes = 7;
  bytes source_owner = 8;
  bytes destination_owner = 9;
}

// Replay the destination's durable adoption facts as the canonical
// KV9EVD01 receipt (task = 0). Read-only; grants no quiesce or release.
message EmitInstallEvidenceRequest {
  bytes root_digest = 1;
  uint64 region = 2;
}
message EmitInstallEvidenceResponse {
  bytes receipt = 1;
  bytes image_digest = 2;
  uint64 cut_term = 3;
  uint64 cut_index = 4;
}

// Commit one destination-install evidence row through the metadata leader.
// The committed migration is the authority the receipt must match exactly.
message RecordInstallEvidenceRequest {
  bytes root_digest = 1;
  bytes receipt = 2; // Canonical KV9EVD01 receipt, exactly 200 bytes.
}
message RecordInstallEvidenceResponse {
  uint64 task = 1;
  // False confirms the identical committed row; a NEW confirmation commit.
  bool changed = 2;
}

// Commit one migration-abort decision at the metadata leader: the
// stranded-destination recovery. Refused when committed install evidence
// exists; the abort subject is read from the PUBLISHED source pin, never
// supplied by the caller. Nothing is detached, released or deleted here.
message RecordMigrationAbortRequest {
  bytes root_digest = 1;
  bytes operation_id = 2; // 16 bytes.
}
message RecordMigrationAbortResponse {
  uint64 task = 1;
  // False confirms the identical committed row; a NEW confirmation commit.
  bool changed = 2;
}

// Remove the aborted operation's stranded LEARNER from the source group's
// configuration, at the source leader, gated on the committed abort. A
// voter destination refuses: abort authority never removes voters.
message DetachAbortedLearnerRequest {
  bytes root_digest = 1;
  bytes operation_id = 2; // 16 bytes.
}
message DetachAbortedLearnerResponse {
  uint64 detached_node = 1;
  // False confirms an already-absent learner.
  bool changed = 2;
  repeated uint64 voters = 3;
}

// Commit one healthy-group compaction floor at the metadata leader.
// Floors per region strictly increase; nothing is compacted here — each
// replica executes locally once its applied position reaches the floor.
message RecordGroupCompactionRequest {
  bytes root_digest = 1;
  uint64 region_id = 2;
  uint64 floor_term = 3;
  uint64 floor_index = 4;
}
message RecordGroupCompactionResponse {
  uint64 task = 1;
  bool changed = 2;
}

// Commit one source-truncation decision at the metadata leader. Its floor
// is bounded by the committed evidence cut; nothing is compacted here.
message RecordSourceTruncationRequest {
  bytes root_digest = 1;
  bytes operation_id = 2;
  uint64 floor_term = 3;
  uint64 floor_index = 4;
}
message RecordSourceTruncationResponse {
  uint64 task = 1;
  bool changed = 2;
}

// Compact the SOURCE GROUP LEADER's own retained log below the committed
// floor. Leader-only; every tracked peer must have matched the floor.
message TruncateSourceLogRequest {
  bytes root_digest = 1;
  bytes operation_id = 2;
}
message TruncateSourceLogResponse {
  uint64 floor_term = 1;
  uint64 floor_index = 2;
  uint64 first_index = 3; // The retained log's first index afterwards.
}

// Promote the committed migration's destination from learner to VOTER of
// the source group, through the group's own log. Requires the committed
// install evidence: the destination durably adopted the image and runs it.
message PromoteMigrationVoterRequest {
  bytes root_digest = 1;
  bytes operation_id = 2;
}
message PromoteMigrationVoterResponse {
  uint64 destination_node = 1;
  // False confirms an existing voter; the receipt is a NEW commit.
  bool changed = 2;
  repeated uint64 voters = 3; // Sorted post-apply voter set.
}

// Commit one source-replica removal decision at the metadata leader. It
// names one exact initial replica (node + incarnation), never the
// destination; nothing is removed here.
message RecordSourceRemovalRequest {
  bytes root_digest = 1;
  bytes operation_id = 2;
  uint64 source_node = 3;
  bytes source_incarnation = 4; // 16 bytes, the exact creation replica.
}
message RecordSourceRemovalResponse {
  uint64 task = 1;
  bool changed = 2;
}

// Remove the committed decision's replica from the group's voter set,
// through the group's own log. Leader-only; the destination must already
// be a voter; at least three voters must remain; no self-removal.
message RemoveSourceReplicaRequest {
  bytes root_digest = 1;
  bytes operation_id = 2;
}
message RemoveSourceReplicaResponse {
  uint64 removed_node = 1;
  // False confirms an already-removed replica; the receipt is a NEW commit.
  bool changed = 2;
  repeated uint64 voters = 3; // Sorted post-apply voter set.
}

message BindMigrationImageResponse {
  bytes source_owner = 1; // 16-byte ledger owner IDs, both Published.
  bytes destination_owner = 2;
}

message ApplyRetentionRequest {
  // Canonical KV9RTX01 frame, including exact root; at most 16 KiB.
  bytes command = 1;
}
message ApplyRetentionResponse {
  uint64 revision = 1;
  // If false, the position is a NEW confirmation, not an original receipt.
  bool changed = 2;
  uint64 applied_term = 3;
  uint64 applied_index = 4;
}
message GetRetentionOwnerRequest {
  bytes root_digest = 1;
  bytes owner_id = 2;
}
message GetRetentionOwnerResponse {
  bool found = 1;
  // Canonical KV9OWN01 observation, not a usable retention capability.
  bytes owner = 2;
}

message NodeEndpoint {
  uint64 node_id = 1;
  bytes store_incarnation = 2;
  string address = 3;
  uint64 generation = 4;
  optional string previous_address = 5;
  bool active = 6;
}

message GetNodeEndpointRequest { uint64 node_id = 1; }
message NodeStatusRequest {}
message StatusField {
  string name = 1;
  string value = 2;
}
message StatusPeer {
  uint64 node_id = 1;
  string address = 2;
}
message NodeStatusResponse {
  // The node's status document, one field per line of its status file, in file
  // order. JSON-valued lines (voter_replacement, data_groups, ...) stay JSON text.
  repeated StatusField fields = 1;
  // This node's LOCAL applied view of the node directory (id, address): enough for
  // a client holding one follower's address to find the leader. Not linearizable;
  // ListNodes is.
  repeated StatusPeer peers = 2;
}
message ListNodesRequest {}
message NodeRow {
  uint64 node_id = 1;
  string address = 2;
  bytes store_incarnation = 3;    // empty until the node registered
  uint64 endpoint_generation = 4;
  bool active = 5;                // the catalog's membership state
  uint64 last_heartbeat_unix = 6;
  // Raft view from the answering leader: "voter", "learner" or "none".
  string raft_role = 7;
  uint64 matched_index = 8;
  bool recent_active = 9;
  // Pending admission, if any: "pending", "consumed", "revoked", "superseded" or "".
  string admission_state = 10;
  uint64 admission_expires_unix = 11;
}
message ListNodesResponse {
  uint64 leader_node_id = 1;
  uint64 raft_committed = 2;
  repeated NodeRow nodes = 3;
}
message ListDataGroupsRequest {}
message DataGroupReplica {
  uint64 node_id = 1;
  bytes store_incarnation = 2;
}
message DataGroupKeyspace {
  uint32 keyspace_id = 1;
  uint64 tenant_id = 2;
  uint64 bind_task = 3;     // the kind-102 row
  uint64 conf_ver = 4;
  uint64 version = 5;
  bytes start = 6;
  bytes end = 7;
  bool sealed = 8;
}
message DataGroupMigration {
  uint64 task = 1;          // kind 103
  bytes operation = 2;
  DataGroupReplica destination = 3;
  uint64 evidence_task = 4; // kind 104, 0 if none
  uint64 abort_task = 5;    // kind 108, 0 if none
  uint64 removal_task = 6;  // kind 106, 0 if none
  uint64 truncation_task = 7; // kind 105, 0 if none
}
message DataGroupRow {
  uint64 creation_task = 1; // kind 100
  uint64 region_id = 2;
  bytes operation = 3;
  repeated DataGroupReplica replicas = 4;
  bool activated = 5;       // a kind-101 row exists
  repeated DataGroupKeyspace keyspaces = 6;
  repeated DataGroupMigration migrations = 7;
  optional uint64 compaction_floor_term = 8;  // newest kind-110 row
  optional uint64 compaction_floor_index = 9;
}
message ListDataGroupsResponse {
  repeated DataGroupRow groups = 1;
}
message ListTasksRequest {
  uint64 after = 1;  // exclusive cursor (task id); 0 starts at the beginning
  uint32 limit = 2;  // 1..=256, default 64
  uint64 kind = 3;   // 0 = every kind
}
message TaskRow {
  uint64 id = 1;
  uint64 kind = 2;
  string kind_name = 3;
  uint64 state = 4;
  uint64 created_unix = 5;
  uint64 payload_bytes = 6;
  bytes operation = 7;      // the 16-byte retry identity when the payload carries one
  uint64 reference_task = 8; // the row this one points at (creation for 102/110, migration for 104/108, evidence for 105/106)
}
message ListTasksResponse {
  repeated TaskRow tasks = 1;
  uint64 next_after = 2;    // 0 when the history is exhausted
}
message GetNodeEndpointResponse {
  bytes cluster_id = 1;
  // Absent means the node is not in the directory at this linearizable read.
  NodeEndpoint endpoint = 2;
}

message ChangeNodeEndpointRequest {
  bytes cluster_id = 1;
  uint64 node_id = 2;
  bytes store_incarnation = 3;
  string expected_address = 4;
  uint64 expected_generation = 5;
  string new_address = 6;
}

message EndpointReceipt {
  NodeEndpoint endpoint = 1;
  uint64 applied_term = 2;
  uint64 applied_index = 3;
}

enum EndpointRefusal {
  ENDPOINT_REFUSAL_UNSPECIFIED = 0;
  ENDPOINT_REFUSAL_WRONG_CLUSTER = 1;
  ENDPOINT_REFUSAL_MISSING_NODE = 2;
  ENDPOINT_REFUSAL_INACTIVE_NODE = 3;
  ENDPOINT_REFUSAL_INVALID_INCARNATION = 4;
  ENDPOINT_REFUSAL_CONFLICT = 5;
  ENDPOINT_REFUSAL_GENERATION_EXHAUSTED = 6;
}

message ChangeNodeEndpointResponse {
  oneof outcome {
    // The position of this invocation's committed mutation.
    EndpointReceipt changed = 1;
    // A fresh exact confirmation barrier. This is never an original receipt.
    EndpointReceipt confirmed = 2;
    // This invocation did not stage an endpoint mutation.
    EndpointRefusal refused = 3;
  }
}

message AdmitNodeRequest {
  uint64 node_id = 1;
  string addr = 2;
  uint64 ttl_seconds = 3;
}

message PromoteNodeRequest { uint64 node_id = 1; }
message RemoveNodeRequest { uint64 node_id = 1; }

// Revoke a node's admission record (decommission / lost-store retry): a
// revoked record may be replaced by a fresh AdmitNode. Raft membership is
// untouched.
message RevokeAdmissionRequest { uint64 node_id = 1; }

message MembershipChangeResponse {
  uint64 applied_term = 1;
  uint64 applied_index = 2;
  repeated uint64 voters = 3;
  repeated uint64 learners = 4;
  // Present only on AdmitNode. This one-time secret is returned once; the
  // catalog commits only its SHA-256 digest and PromoteNode leaves it empty.
  string join_ticket = 5;
}

// The position a raw write actually reached in the replicated log.
//
// `applied`, not `proposed`: the server already waited for this exact entry to be
// applied before responding, so a client that reads these fields is observing a
// committed fact rather than an intention. Deriving the position from a status file
// instead cannot prove identity -- a concurrent command can move that number.
message RawWriteResponse {
  uint64 applied_term = 1;
  uint64 applied_index = 2;
}

// A range delete is several entries, so its outcome is a progress report.
//
// An empty or no-op range legitimately reports zero chunks and a 0/0 position.
message RawDeleteRangeResponse {
  uint64 committed_chunks = 1;
  uint64 last_applied_term = 2;
  uint64 last_applied_index = 3;
  // Nonempty when a cross-range walk paused at a foreign-leader chunk:
  // continue from exactly here. Committed chunks stay committed.
  bytes resume_from = 4;
}

message RegionEpoch {
  uint64 conf_ver = 1;
  uint64 version = 2;
}

// Required on every data-plane request. The server rejects a missing epoch;
// zero is a valid value inside a present RegionEpoch message.
message RequestContext {
  uint32 keyspace_id = 1;
  RegionEpoch region_epoch = 2;
}

message OptionalValue {
  bool found = 1;
  bytes value = 2;
}

message KeyValue {
  bytes key = 1;
  bytes value = 2;
}

message ScanResponse {
  repeated KeyValue pairs = 1;
  // Nonempty when a cross-range walk paused at a foreign-leader chunk:
  // continue scanning from exactly here, even if this page is empty.
  bytes resume_from = 2;
}

message RawGetRequest {
  RequestContext context = 1;
  bytes key = 2;
}

message RawGetResponse {
  OptionalValue value = 1;
}

message RawBatchGetRequest {
  RequestContext context = 1;
  repeated bytes keys = 2;
}

message RawBatchGetResponse {
  // Positionally aligned with the request keys.
  repeated OptionalValue values = 1;
}

message RawPutRequest {
  RequestContext context = 1;
  bytes key = 2;
  bytes value = 3;
}

message RawBatchPutRequest {
  RequestContext context = 1;
  repeated KeyValue pairs = 2;
}

// One mutation of an atomic range batch. Mutations apply in order (a later
// entry for the same key wins); deleting an absent key is a no-op.
message RawMutation {
  oneof op {
    KeyValue put = 1;
    bytes delete = 2;
  }
}

message RawBatchRequest {
  RequestContext context = 1;
  repeated RawMutation mutations = 2;
}

message RawDeleteRequest {
  RequestContext context = 1;
  bytes key = 2;
}

message RawScanRequest {
  RequestContext context = 1;
  bytes start = 2;
  bytes end = 3;
  uint32 limit = 4;
}

message RawDeleteRangeRequest {
  RequestContext context = 1;
  bytes start = 2;
  bytes end = 3;
}

enum ApiType {
  API_TYPE_UNSPECIFIED = 0;
  // Retired: transactional keyspaces were removed. A request carrying it is refused.
  API_TYPE_TXN = 1;
  API_TYPE_RAW = 2;
}

message CreateKeyspaceRequest {
  string name = 1;
  uint64 tenant_id = 2;
  ApiType api_type = 3;
}

message CreateKeyspaceResponse {
  uint32 keyspace_id = 1;
  // Present when the production Raft-backed runtime served the mutation.
  // Clients use the pair, never index alone, to correlate failover safely.
  optional uint64 proposed_term = 2;
  optional uint64 proposed_index = 3;
}

message ListKeyspacesRequest {}

message Keyspace {
  uint32 id = 1;
  string name = 2;
  uint64 tenant_id = 3;
  ApiType api_type = 4;
  // 5 was txn_group_id (retired with transactional keyspaces).
  reserved 5;
}

message ListKeyspacesResponse {
  repeated Keyspace keyspaces = 1;
}

message GetRegionRequest {
  uint32 keyspace_id = 1;
  bytes key = 2;
}

message RegionLocation {
  uint64 region_id = 1;
  RegionEpoch epoch = 2;
  optional uint64 leader_node_id = 3;
}

message GetRegionResponse {
  RegionLocation region = 1;
}

message ClusterInfoRequest {}

message ClusterInfoResponse {
  uint64 node_count = 1;
  uint64 keyspace_count = 2;
  uint64 region_count = 3;
}

// A follower may return only directory hints. Only a successful metadata
// ReadIndex plus one catalog snapshot may return an authoritative range.
message LookupRawRouteRequest {
  bytes root_digest = 1;
  uint64 tenant_id = 2;
  uint32 keyspace_id = 3;
  bytes key = 4;
}
message LookupRawRouteResponse {
  bytes root_digest = 1;
  repeated NodeEndpoint metadata_peers = 2;
  optional uint64 metadata_leader = 3;
  bytes binding = 4; // Empty for a redirect; otherwise canonical KV9RNG01.
  repeated NodeEndpoint replicas = 5;
  optional uint64 data_leader = 6;
}
message RoutedRawRequest {
  bytes binding = 1; // Exact root/creation/group/namespace/bounds/epochs.
  oneof operation {
    RoutedKeys get = 2;
    RoutedPairs put = 3;
    bytes delete_key = 4;
    RoutedMutations batch = 5; // One atomic range batch inside the bound range.
  }
}
message RoutedKeys { repeated bytes keys = 1; }
message RoutedPairs { repeated KeyValue pairs = 1; }
message RoutedMutations { repeated RawMutation mutations = 1; }
message RoutedRawResponse {
  bytes binding_digest = 1;
