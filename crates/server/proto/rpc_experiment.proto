syntax = "proto3";
package kv9.rpc.experiment;

// Feature-only loopback control; the ordinary public and Raft APIs are unchanged.
service PointStream {
  rpc Exchange(stream PointRequest) returns (stream PointResponse);
}

message PointRequest {
  uint64 id = 1;
  uint32 operation = 2;
  uint64 remaining_micros = 3;
  string authorization = 4;
  bytes payload = 5;
}

message Metadata {
  string key = 1;
  bytes value = 2;
  bool binary = 3;
}

message Reply {
  int32 code = 1;
  string message = 2;
  bytes details = 3;
  repeated Metadata metadata = 4;
  bytes payload = 5;
}

message PointResponse {
  uint64 id = 1;
  Reply reply = 2;
}
