[package]
name = "kv9-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "kv9 storage engine: Engine trait + MemEngine, MVCC column-family layout (default/lock/write), WriteBatch (DESIGN §6.2, §8.1)."

[dependencies]
kv9-common.workspace = true
thiserror.workspace = true
rpds.workspace = true
s3_client.workspace = true
futures_util.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[features]
# Gates `mod testing` (FaultyEngine) out of production builds. Consumers that need
# fault injection enable this from [dev-dependencies] only, never from [dependencies].
testing = []

# The MinIO backend's deadline acceptance binds to WHERE an outcome came from
# (`minio::Completion`), not to error text. That seam is gated behind `testing`, and a file
# in tests/ compiles as a SEPARATE CRATE, so it cannot see a `cfg(test)` item -- the feature
# has to be on for the test build specifically. A self-referential dev-dependency is the
# documented way to say that, and it keeps `testing` off for anyone depending on this crate
# normally.
[dev-dependencies]
kv9-engine = { path = ".", features = ["testing"] }
