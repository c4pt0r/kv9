[package]
name = "kv9-raft"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "kv9 consensus abstraction: RaftGroup trait + a single-node stub impl (DESIGN §6.1)."

[dependencies]
kv9-common.workspace = true
kv9-engine.workspace = true
raft.workspace = true
slog.workspace = true
protobuf.workspace = true
prost.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tonic-prost.workspace = true

[features]
# Testing-only seams: the apply freeze, and the deterministic partition-
# injection surface in the transport (task #28). NEVER enable in a production
# build — the partition mask can drop real raft traffic. The mask is inert
# unless a data-dir/testing-partition file is written, but the surface itself
# must not exist in a shipped binary: a reverse-import probe in a non-test
# build must fail to compile; dev-dependencies with resolver = "2" keep the
# feature out of shipped binaries (kv9-engine precedent).
testing = []

[build-dependencies]
tonic-prost-build.workspace = true
